name: Publish tested 0.69.3 package
# Chỉ chạy thủ công: bản 0.70.0 đang là ứng viên, chưa được phép phát hành tự động.
# Workflow này dựng lại gói 0.69.3 cũ; không dùng cho 0.70.0 cho đến khi được duyệt công khai.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package.py
      - name: Label rebuilt archive and generate its own checksum
        run: |
          cd dist
          mv Vietnam-Legal-Advisor-0.69.3.zip Vietnam-Legal-Advisor-0.69.3-rebuilt.zip
          sha256sum Vietnam-Legal-Advisor-0.69.3-rebuilt.zip > Vietnam-Legal-Advisor-0.69.3-rebuilt.zip.sha256
      - name: Publish provisional release without overwriting an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v0.69.3
          dist/Vietnam-Legal-Advisor-0.69.3-rebuilt.zip
          dist/Vietnam-Legal-Advisor-0.69.3-rebuilt.zip.sha256
          LICENSE.md
          --target "$GITHUB_SHA"
          --title "Vietnam Legal Advisor 0.69.3 — đánh giá AI tạm thời"
          --prerelease
          --notes-file releases/0.69.3/release-notes.md

