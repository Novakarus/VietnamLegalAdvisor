name: Bug report
description: Report a bug with an example that has sensitive information redacted
body:
  - type: markdown
    attributes:
      value: Do not post client data, passwords or unnecessary personal information.
  - type: input
    id: version
    attributes:
      label: Plugin version and platform
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Request, steps taken and actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
